name: Rebuild & Deploy

# Manual only: triggered by the rebuild button in /admin (see
# server/index.js, POST /api/admin/rebuild) via the GitHub API, or by hand.
on:
  workflow_dispatch:

concurrency:
  group: rebuild-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci --prefix server

      - name: Reject vulnerable dependencies
        run: npm run audit:security

      - name: Lint and test
        run: npm run verify

      # Prerender the current catalog and admin settings instead of stale
      # committed data. Settings matter here beyond freshness: the prerenderer
      # has no network, so the admin's share title/description/image only reach
      # link previews if they are baked in before the build.
      - run: npm run data:pull

      - name: Build and run the browser hydration check
        run: npm run build:seo

      - name: Preserve the verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust the VPS host key
        run: mkdir -p ~/.ssh && echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts

      # The sitemap still live, to tell IndexNow only what this release changes.
      # A failed fetch leaves no file, and the IndexNow step then sends every page.
      - name: Remember the live sitemap
        run: curl -fsS --max-time 20 https://hsmuebles.es/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" || rm -f "$RUNNER_TEMP/previous-sitemap.xml"

      - name: Deploy with smoke-check and automatic rollback
        env:
          RELEASE_ID: ${{ github.sha }}
        run: node scripts/deploy-dist.mjs

      # Bing (and so ChatGPT's search) otherwise notices a new or removed
      # product weeks later. Best effort: a refusal shows as a warning here and
      # never fails a deploy that already went out.
      - name: Tell Bing what changed (IndexNow)
        continue-on-error: true
        run: node scripts/indexnow.mjs --previous "$RUNNER_TEMP/previous-sitemap.xml" --current dist/sitemap.xml
