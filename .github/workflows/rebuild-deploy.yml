name: Rebuild & Deploy

# Manual only — triggered by the "Пересобрать сайт" button in /admin (see
# server/index.js, POST /api/admin/rebuild) via the GitHub API, or by hand
# from the Actions tab. Builds on GitHub's runner (plenty of CPU/RAM) rather
# than the VPS, which is a small shared box already tight on both — see
# DEPLOY.md.
on:
  workflow_dispatch:

# Two rebuilds racing would both scp into the same dist.new/dist.old on the
# VPS (see scripts/deploy-dist.mjs) — queue instead of running in parallel.
concurrency:
  group: rebuild-deploy
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fresh catalog from the live DB (via the public /api/catalog endpoint)
      # — prerendering otherwise ships whatever was last committed.
      - run: npm run catalog:pull

      - run: npm run build:seo

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust the VPS host key
        run: mkdir -p ~/.ssh && echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - run: node scripts/deploy-dist.mjs
