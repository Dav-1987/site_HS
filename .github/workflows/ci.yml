name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Smoke-tests the SEO build pipeline (vite build + prerender + sitemap)
      # against the committed catalog.default.json — catches a broken
      # prerender/route before it ever reaches a real deploy.
      - run: npm run build:seo
