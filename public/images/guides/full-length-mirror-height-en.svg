<svg xmlns="http://www.w3.org/2000/svg" width="480" height="570" viewBox="0 0 480 570" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">A mirror placement example</title>
  <desc id="description">For a person 170 cm tall with eyes 160 cm above the floor, the glass must cover 80 to 165 cm above the floor. Light from the head and feet reflects towards the eyes. Theoretical minimum: 85 cm of glass.</desc>
  <rect width="480" height="570" fill="#EFEAE2"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#8A6A2F" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="Arial, sans-serif" fill="#2B2B2B">
    <text x="24" y="35" font-size="23">A mirror placement example</text>
    <text x="24" y="64" font-size="18">Flat, vertical mirror</text>
    <path d="M34 460H448" fill="none" stroke="#746B5F" stroke-width="1.5"/>
    <path d="M160 120V460" fill="none" stroke="#746B5F" stroke-width="2"/>
    <path d="M160 120 320 130 160 140" fill="none" stroke="#8A6A2F" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <path d="M160 460 320 300 160 140" fill="none" stroke="#8A6A2F" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M320 130V300" fill="none" stroke="#2B2B2B" stroke-width="9"/>
    <path d="M315 130V300" fill="none" stroke="#C4A265" stroke-width="3"/>
    <g fill="#2B2B2B"><circle cx="160" cy="120" r="4"/><circle cx="160" cy="140" r="5"/><circle cx="160" cy="460" r="4"/></g>
    <path d="M66 120V460 M60 120H72 M60 460H72" fill="none" stroke="#746B5F" stroke-width="1.5"/>
    <text x="45" y="290" text-anchor="middle" transform="rotate(-90 45 290)" font-size="19">Your height: 170 cm</text>
    <text x="160" y="106" text-anchor="middle" font-size="19">Head</text>
    <text x="142" y="174" text-anchor="end" font-size="19">Eyes</text>
    <text x="320" y="106" text-anchor="middle" font-size="19">Usable glass</text>
    <text x="340" y="137" font-size="18">165 cm</text>
    <text x="340" y="307" font-size="18">80 cm</text>
    <path d="M430 130V300 M424 130H436 M424 300H436" fill="none" stroke="#746B5F" stroke-width="1.5"/>
    <text x="455" y="215" text-anchor="middle" transform="rotate(-90 455 215)" font-size="19">85 cm of glass</text>
    <text x="160" y="486" text-anchor="middle" font-size="19">Feet · floor</text>
    <text x="24" y="527" font-size="18">Example: eyes 160 cm above the floor.</text>
    <text x="24" y="551" font-size="17">The lines show light reaching your eyes.</text>
  </g>
</svg>
